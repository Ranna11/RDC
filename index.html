<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中心仓品类品牌规划</title>
  <link rel="stylesheet" href="styles.css?v=20260618142040">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">RDC Brand Planning</p>
      <h1>中心仓品类品牌规划</h1>
    </div>
    <div class="header-actions">
      <button id="resetFilters" class="ghost-btn" type="button" title="重置筛选">重置</button>
      <button id="exportCsv" class="solid-btn" type="button" title="导出当前结果">导出 CSV</button>
    </div>
  </header>

  <main>
    <section class="planning-note" aria-label="规划说明">
      <div class="note-head">
        <div class="note-popover">
          <span class="note-trigger">规划说明 <span aria-hidden="true">ⓘ</span></span>
          <div id="planningRules" class="rule-grid"></div>
        </div>
        <span id="sourceName" class="source-pill"></span>
      </div>
    </section>

    <section class="filter-band" aria-label="筛选">
      <div class="filter-grid">
        <label class="search-box">
          <span>搜索</span>
          <input id="keywordInput" type="search" placeholder="输入品类或品牌">
        </label>
        <div id="majorFilter" class="multi-filter"></div>
        <div id="categoryFilter" class="multi-filter"></div>
        <div id="brandFilter" class="multi-filter"></div>
        <label class="metric-select">
          <span>视角</span>
          <select id="viewSelect">
            <option value="manager">品类经理输出</option>
            <option value="system">数据逻辑输出</option>
            <option value="final">最终备货方案</option>
          </select>
        </label>
        <label class="metric-select">
          <span>指标查看</span>
          <select id="metricSelect"></select>
        </label>
        <div class="segmented" aria-label="状态筛选">
          <button class="segment is-active" type="button" data-status="全部">全部</button>
          <button class="segment" type="button" data-status="有备货">有备货</button>
          <button class="segment" type="button" data-status="有退出">有退出</button>
        </div>
      </div>
      <div id="chips" class="chips"></div>
    </section>

    <section class="summary-strip" aria-label="摘要">
      <div class="metric metric-cost"><label>当前库存成本</label><span id="currentInventoryCost">0</span></div>
      <div class="metric metric-target"><label>理论库存成本</label><span id="theoreticalInventoryCost">0</span></div>
      <div class="metric metric-alert"><label>库存优化空间</label><span id="inventoryGap">0</span></div>
      <div class="metric metric-muted"><label>其他库存成本（品牌为其他）</label><span id="otherBrandInventoryCost">0</span></div>
      <div class="metric metric-sales"><label>近90天销售成本</label><span id="salesCost90">0</span></div>
      <div class="metric metric-order"><label>近90天订货成本</label><span id="orderCost90">0</span></div>
      <div class="metric metric-turnover"><label>销售周转天数</label><span id="salesTurnoverDays">0</span></div>
      <div class="metric metric-outbound"><label>出库周转天数</label><span id="outboundTurnoverDays">0</span></div>
    </section>

    <section class="matrix-shell" aria-label="规划矩阵">
      <div class="table-toolbar">
        <div id="resultTitle" class="result-title"></div>
      <div class="legend">
        <span><i class="dot stock"></i>备货</span>
        <span><i class="dot no-stock"></i>不备货</span>
        <span><i class="dot adjusted"></i>与品类经理规划不一致</span>
      </div>
      </div>
      <div class="table-wrap">
        <table id="planTable"></table>
      </div>
      <div id="mobileCenterCounts" class="mobile-center-counts"></div>
      <div id="mobileResults" class="mobile-results"></div>
    </section>
  </main>

  <aside id="detailPanel" class="detail-panel" aria-hidden="true">
    <div class="detail-head">
      <div>
        <p id="detailCenter" class="eyebrow"></p>
        <h2 id="detailTitle"></h2>
      </div>
      <button id="closePanel" class="icon-btn" type="button" title="关闭">×</button>
    </div>
    <div id="detailBody" class="detail-body"></div>
  </aside>
  <div id="panelBackdrop" class="panel-backdrop"></div>

  <script src="app.js?v=20260618142040"></script>
</body>
</html>
